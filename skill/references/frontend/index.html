<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place Hunt</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root {
    --bg: #f6f5f3;
    --ink: #1c1a17;
    --muted: #6f6a63;
    --line: #e0ddd7;
    --card: #fffefc;
    --shadow: 0 1px 2px rgba(28,26,23,.10), 0 6px 20px rgba(28,26,23,.10);

    --status-new: #8a8279;
    --status-interested: #c98a1b;
    --status-toured: #2f6f8f;
    --status-passed: #b4574d;

    --cat-home: #3b82f6;
    --cat-group: #8b5cf6;
    --cat-camping: #10b981;
    --cat-park: #059669;
    --cat-restaurant: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --ink: #f0ede8;
      --muted: #9d968d;
      --line: #322f2b;
      --card: #201e1b;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.45);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  header h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header .count { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }

  .filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:hover {
    border-color: var(--muted);
  }
  .filter-btn.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .legend { display: flex; gap: 14px; margin-left: auto; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  #map { flex: 1 1 auto; min-height: 320px; background: var(--bg); }

  /* Notices — an empty map must always say why it is empty. */
  .notice {
    flex: none;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--card);
    font-size: 13px;
    color: var(--muted);
  }
  .notice strong { color: var(--ink); font-weight: 600; }
  .notice ul { margin: 6px 0 0; padding-left: 18px; }
  .notice.error { color: #b4574d; }

  /* --- Map pins: photo/icon + price/facts chip --- */
  .pin { width: 104px; text-align: center; cursor: pointer; }
  .pin .shot {
    width: 52px; height: 52px; margin: 0 auto;
    border-radius: 50%;
    background: var(--card) center/cover no-repeat;
    border: 3px solid var(--ring, var(--status-new));
    box-shadow: var(--shadow);
    display: grid; place-items: center;
    font-size: 22px; color: var(--muted);
  }
  .pin .chip {
    display: inline-block; margin-top: 4px; padding: 2px 7px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
    box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums;
  }
  .pin.passed .shot, .pin.passed .chip { opacity: .55; }

  /* --- Popup --- */
  .leaflet-popup-content { margin: 0; width: 280px !important; }
  .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; overflow: hidden; background: var(--card); color: var(--ink); }
  .leaflet-popup-tip { background: var(--card); }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; background: var(--line); }
  .card .body { padding: 12px 14px 14px; }
  .card .cat-badge {
    display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--line); color: var(--muted); margin-bottom: 6px;
  }
  .card .title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 2px; }
  .card .price { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .card .facts { color: var(--muted); font-size: 12.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card .addr { margin-top: 7px; font-size: 13px; line-height: 1.35; color: var(--ink); }
  .card .meta { margin-top: 9px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .card .tag { padding: 2px 8px; border-radius: 999px; background: var(--ring, var(--status-new)); color: #fff; font-weight: 600; }
  .card .stars { color: #c98a1b; letter-spacing: 1px; }
  .card .notes { margin-top: 9px; font-size: 12.5px; color: var(--muted); font-style: italic; background: rgba(128,128,128,0.06); padding: 5px 8px; border-radius: 6px; }
  .card a.go {
    display: block; margin-top: 12px; padding: 8px; border-radius: 8px;
    background: var(--ink); color: var(--bg);
    text-align: center; text-decoration: none; font-size: 13px; font-weight: 600;
  }
</style>
</head>
<body>

<header>
  <h1>Place Hunt</h1>
  <span class="count" id="count"></span>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="home">🏠 Homes</button>
    <button class="filter-btn" data-cat="group_venue">👥 Groups</button>
    <button class="filter-btn" data-cat="camping">⛺ Camping</button>
    <button class="filter-btn" data-cat="park">🌳 Parks</button>
    <button class="filter-btn" data-cat="restaurant">🍽️ Dining</button>
  </div>
  <div class="legend" id="legend"></div>
</header>

<div id="map"></div>
<div id="notices"></div>

<script src="vendor/leaflet.js"></script>
<script>
(function () {
  var STATUS_COLORS = {
    new: 'var(--status-new)',
    interested: 'var(--status-interested)',
    toured: 'var(--status-toured)',
    visited: 'var(--status-toured)',
    booked: 'var(--status-interested)',
    passed: 'var(--status-passed)'
  };

  var CATEGORY_ICONS = {
    home: '⌂',
    group_venue: '👥',
    camping: '⛺',
    park: '🌳',
    restaurant: '🍽',
    other: '📍'
  };

  var CATEGORY_LABELS = {
    home: 'Home',
    group_venue: 'Group Venue',
    camping: 'Campground',
    park: 'Park',
    restaurant: 'Restaurant',
    other: 'Place'
  };

  var notices = document.getElementById('notices');
  var allRows = [];
  var currentCategory = 'all';
  var map = null;
  var markersLayer = null;

  function notice(html, isError) {
    var el = document.createElement('div');
    el.className = 'notice' + (isError ? ' error' : '');
    el.innerHTML = html;
    notices.appendChild(el);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function shortPrice(n, s) {
    if (s && s.price_tier) return s.price_tier;
    if (n == null) return '';
    if (n >= 1e6) return '$' + String(+(n / 1e6).toFixed(2)) + 'M';
    if (n >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
    return '$' + n;
  }

  function fullPrice(n, s) {
    if (s && s.price_tier) return s.price_tier + (n != null ? ' · $' + n.toLocaleString('en-US') : '');
    return n == null ? '' : '$' + n.toLocaleString('en-US');
  }

  function facts(s) {
    var parts = [];
    var cat = s.category || 'home';
    if (cat === 'home') {
      if (s.beds != null) parts.push(s.beds + ' bd');
      if (s.baths != null) parts.push(s.baths + ' ba');
      if (s.sqft != null) parts.push(s.sqft.toLocaleString('en-US') + ' sqft');
    } else if (cat === 'group_venue') {
      if (s.capacity != null) parts.push('Seats ' + s.capacity);
      if (s.amenities && s.amenities.length) parts.push(s.amenities.slice(0, 2).join(', '));
    } else if (cat === 'restaurant') {
      if (s.cuisine) parts.push(s.cuisine);
      if (s.capacity != null) parts.push('Seats ' + s.capacity);
    } else if (cat === 'camping') {
      if (s.amenities && s.amenities.length) parts.push(s.amenities.slice(0, 3).join(' · '));
    } else if (cat === 'park') {
      if (s.amenities && s.amenities.length) parts.push(s.amenities.slice(0, 3).join(' · '));
    } else {
      if (s.beds != null) parts.push(s.beds + ' bd');
      if (s.baths != null) parts.push(s.baths + ' ba');
    }
    return parts.join('  ·  ');
  }

  fetch('data.js')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (rows) {
      allRows = rows;
      initMap();
      render();
    })
    .catch(function () {
      notice('<strong>Could not load data.js.</strong> The store is missing or damaged. ' +
             'Ask your Place Hunt agent to check it.', true);
    });

  // Category filter handlers
  document.getElementById('filters').addEventListener('click', function (e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentCategory = btn.getAttribute('data-cat') || 'all';
    render();
  });

  function initMap() {
    map = L.map('map', { scrollWheelZoom: true });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);
  }

  function render() {
    try {
      markersLayer.clearLayers();
      notices.innerHTML = '';

      var rows = allRows.filter(function (r) {
        if (currentCategory === 'all') return true;
        var cat = r.scraped.category || 'home';
        return cat === currentCategory;
      });

      var mapped = rows.filter(function (r) { return r.scraped.lat != null && r.scraped.lng != null; });
      var unmapped = rows.filter(function (r) { return r.scraped.lat == null || r.scraped.lng == null; });

      document.getElementById('count').textContent =
        rows.length === 0 ? 'nothing saved' : rows.length + (rows.length === 1 ? ' place' : ' places');

      var seen = {};
      rows.forEach(function (r) { seen[r.mine.status] = true; });
      document.getElementById('legend').innerHTML = Object.keys(seen).map(function (st) {
        return '<span><i style="background:' + (STATUS_COLORS[st] || STATUS_COLORS.new) + '"></i>' + esc(st) + '</span>';
      }).join('');

      var PIN_W = 104, PIN_H = 78, FAN_RADIUS = 34;
      var atPoint = {};
      mapped.forEach(function (r) {
        var key = r.scraped.lat.toFixed(5) + ',' + r.scraped.lng.toFixed(5);
        (atPoint[key] = atPoint[key] || []).push(r);
      });
      var anchorShift = {};
      Object.keys(atPoint).forEach(function (key) {
        var group = atPoint[key];
        if (group.length < 2) return;
        group.forEach(function (r, i) {
          var angle = (2 * Math.PI * i) / group.length - Math.PI / 2;
          anchorShift[r.id] = [FAN_RADIUS * Math.cos(angle), FAN_RADIUS * Math.sin(angle)];
        });
      });

      mapped.forEach(function (r) {
        var s = r.scraped;
        var cat = s.category || 'home';
        var shift = anchorShift[r.id] || [0, 0];
        var color = STATUS_COLORS[r.mine.status] || STATUS_COLORS.new;
        var iconGlyph = CATEGORY_ICONS[cat] || '📍';
        var shot = s.photo
          ? '<div class="shot" style="background-image:url(\'' + esc(s.photo) + '\')"></div>'
          : '<div class="shot">' + iconGlyph + '</div>';

        var chipBits = [];
        var pr = shortPrice(s.price, s);
        if (pr) chipBits.push(pr);
        if (cat === 'home' && s.beds != null) chipBits.push(s.beds + 'bd');
        else if (cat === 'group_venue' && s.capacity != null) chipBits.push('Cap ' + s.capacity);
        else if (cat === 'restaurant' && s.cuisine) chipBits.push(s.cuisine);
        else if (!chipBits.length) chipBits.push(CATEGORY_LABELS[cat] || 'Place');

        var marker = L.marker([s.lat, s.lng], {
          icon: L.divIcon({
            className: '',
            html: '<div class="pin ' + esc(r.mine.status) + '" style="--ring:' + color + '">' +
                  shot + '<span class="chip">' + esc(chipBits.join(' · ')) + '</span></div>',
            iconSize: [PIN_W, PIN_H],
            iconAnchor: [PIN_W / 2 - shift[0], 26 - shift[1]]
          })
        }).addTo(markersLayer);

        var stars = r.mine.rating == null ? '' : '<span class="stars">' + '★'.repeat(r.mine.rating) + '</span>';
        var titleText = s.name || s.address;
        var fullPr = fullPrice(s.price, s);
        var fText = facts(s);

        marker.bindPopup(
          '<div class="card" style="--ring:' + color + '">' +
            (s.photo ? '<img src="' + esc(s.photo) + '" alt="">' : '') +
            '<div class="body">' +
              '<span class="cat-badge">' + esc(CATEGORY_LABELS[cat] || cat) + '</span>' +
              '<div class="title">' + esc(titleText) + '</div>' +
              (fullPr ? '<div class="price">' + esc(fullPr) + '</div>' : '') +
              (fText ? '<div class="facts">' + esc(fText) + '</div>' : '') +
              '<div class="addr">' + esc(s.address) + (s.city ? ', ' + esc(s.city) : '') + (s.state ? ' ' + esc(s.state) : '') + '</div>' +
              '<div class="meta"><span class="tag">' + esc(r.mine.status) + '</span>' + stars + '</div>' +
              (r.mine.notes ? '<div class="notes">' + esc(r.mine.notes) + '</div>' : '') +
              '<a class="go" href="' + esc(s.listing_url) + '" target="_blank" rel="noopener">Open Listing / Details</a>' +
            '</div>' +
          '</div>'
        );
      });

      if (mapped.length > 0) {
        map.fitBounds(L.latLngBounds(mapped.map(function (r) { return [r.scraped.lat, r.scraped.lng]; })), {
          padding: [70, 70],
          maxZoom: 15
        });
      } else {
        map.setView([37.7749, -122.4194], 11);
      }

      if (unmapped.length > 0) {
        notice('<strong>' + unmapped.length + ' not on the map</strong> (no coordinates):<ul>' +
          unmapped.map(function (r) {
            return '<li><a href="' + esc(r.scraped.listing_url) + '" target="_blank" rel="noopener">' +
                   esc(r.scraped.name || r.scraped.address) + ', ' + esc(r.scraped.city) + '</a></li>';
          }).join('') + '</ul>');
      }

      if (rows.length === 0) {
        notice('No places saved in this view yet. Text your agent a place, restaurant, park, campsite, or home to add one!');
      }
    } catch (err) {
      notice('<strong>Could not draw the map.</strong> data.js loaded but an item is malformed: ' +
             esc(String((err && err.message) || err)), true);
    }
  }
})();
</script>
</body>
</html>
